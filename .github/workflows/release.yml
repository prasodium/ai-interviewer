name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-mac:
    runs-on: macos-latest
    strategy:
      matrix:
        arch: [arm64, x64]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npm ci

      - run: npm run typecheck

      - run: npm test

      - run: npm run build

      - name: Build macOS DMG (${{ matrix.arch }})
        # Built as separate jobs per arch (not one --mac call covering
        # both) because building both DMGs in the same run hits a known
        # hdiutil/volume-mount collision on GitHub's macOS runners.
        run: npx electron-builder --mac --${{ matrix.arch }} --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - uses: actions/upload-artifact@v4
        with:
          name: mac-build-${{ matrix.arch }}
          path: |
            release/*.dmg
            release/*.blockmap
          if-no-files-found: error

  build-win:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npm ci

      - run: npm run typecheck

      - run: npm test

      - run: npm run build

      - name: Build Windows installer
        run: npx electron-builder --win --publish never

      - uses: actions/upload-artifact@v4
        with:
          name: win-build
          path: |
            release/*.exe
            release/*.blockmap
          if-no-files-found: error

  publish-release:
    needs: [build-mac, build-win]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          pattern: mac-build-*
          path: dist/mac
          merge-multiple: true

      - uses: actions/download-artifact@v4
        with:
          name: win-build
          path: dist/win

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" \
            dist/mac/* dist/win/* \
            --title "AI Interviewer ${{ github.ref_name }}" \
            --notes-file RELEASE_NOTES.md \
            --latest
