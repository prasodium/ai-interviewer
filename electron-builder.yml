appId: com.aiinterviewer.app
productName: AI Interviewer
copyright: Copyright © 2026

# The release workflow publishes built installers to a GitHub Release
# itself (see .github/workflows/release.yml) - without this, electron-
# builder auto-detects the git tag in CI and tries to publish on its
# own, which fails without a GH_TOKEN passed into this exact step.
publish: null

directories:
  output: release
  buildResources: resources

files:
  - out/**/*
  - package.json

# No custom icon is included yet - electron-builder falls back to a
# default icon. Drop icon.icns / icon.ico into resources/ and add
# `icon: resources/icon` under each platform below to brand the app.

mac:
  # No arch list here on purpose - the release workflow builds arm64 and
  # x64 as separate CI jobs (via --arm64 / --x64 on the CLI) to avoid a
  # known hdiutil volume-mount collision when both are built in one run.
  # An explicit arch list here would override those CLI flags.
  target:
    - dmg
  category: public.app-category.productivity
  # Required for macOS to show the microphone permission prompt at all -
  # without this key, getUserMedia() fails silently with no dialog.
  extendInfo:
    NSMicrophoneUsageDescription: AI Interviewer needs microphone access to hear your spoken interview answers.

dmg:
  title: AI Interviewer
  # electron-builder's default DMG filename omits the arch suffix for
  # x64 specifically (only arm64 gets one), which makes it easy to
  # mistake the Intel build for a universal/default one. Always
  # including the arch removes that ambiguity.
  artifactName: "${productName}-${version}-${arch}.${ext}"

win:
  target:
    - target: nsis
      arch:
        - x64

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true

linux:
  target:
    - AppImage
  category: Office
